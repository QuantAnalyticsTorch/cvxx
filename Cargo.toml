[workspace]
members = [".", "cvxrust", "tools/gen-examples"]
resolver = "2"

[package]
name = "cvxx"
version = "1.0.0"
edition = "2021"
description = "Excel add-in exposing cvxrust convex optimization via a Rust XLL"
license = "GPL-3.0-only"
authors = ["cvxx contributors"]

[lib]
name = "cvxx"
crate-type = ["cdylib", "rlib"]

[profile.dev]
opt-level = 3
debug = false
lto = false
codegen-units = 16

[dependencies]
cvxrust = { path = "cvxrust" }
xladd = "0.1.2"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
